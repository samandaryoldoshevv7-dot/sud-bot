name: Bot regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: court
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: court_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U court -d court_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://court:devpass@127.0.0.1:5433/court_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m pytest -q
